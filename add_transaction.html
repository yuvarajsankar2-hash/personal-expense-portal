{% extends 'base.html' %}{% block title %}Add Transaction | Expense Portal{% endblock %}
{% block content %}<div class="form-card"><h1>Add Transaction</h1><form method="post"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Date</label><input class="form-control" type="date" name="transaction_date" value="{{ today }}" required></div><div class="col-md-6 mb-3"><label class="form-label">Transaction Type</label><select class="form-select" name="transaction_type" required><option value="Spend">Spend</option><option value="Received">Received</option></select></div></div><div class="mb-3"><label class="form-label">Amount</label><input class="form-control" type="number" name="amount" min="0.01" step="0.01" required></div><div class="mb-3"><label class="form-label">Category</label><input class="form-control" name="category" placeholder="Food, Salary, Rent, Travel" required></div><div class="mb-3"><label class="form-label">Description (optional)</label><textarea class="form-control" name="description" rows="3"></textarea></div><button class="btn btn-primary">Save Transaction</button><a class="btn btn-outline-secondary ms-2" href="{{ url_for('home') }}">Cancel</a></form></div>{% endblock %}
